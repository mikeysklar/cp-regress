#
# settings.toml scenarios for test/hardware/settings_scenarios_test.py, after Brent's secrets
# scenarios (hil/firmware/conftest.py:252-366, hil/firmware/provisioning/test_secrets.py and
# EDGE_CASES.md from 818884e3, all in adafruit/Adafruit_Wippersnapper_Arduino add-hil-ci-cd).
#
# One [scenario.<name>] per scenario. Its bytes come from:
#   source = "generated"   build_generated() in test/fixtures/secrets.py
#   source = "file"        <name>.settings.toml in this dir, a template: @@SSID@@, @@PASSWORD@@,
#                          @@BROKER_HOST@@, @@BROKER_PORT@@, @@WEB_API_PASSWORD@@ are filled
#                          from base_secrets (.env) into tmp_path. No secret is ever in here.
#   source = "none"        no settings.toml on CIRCUITPY
#   source = "not_ported"  Brent's case has no safe CircuitPython equivalent; `cp` says why
#
# What it should do:
#   spec          "valid" / "invalid" as TOML 1.0.0, from spec_ref (toml.io/en/v1.0.0 anchors).
#                 settings_scenarios_test.py checks every verdict against Python's tomllib.
#   cp            what CircuitPython should do, read from adafruit/circuitpython 2d299b0:
#                 supervisor/shared/settings.c (key_matches, read_value, read_string_value,
#                 read_bare_value, print_error), supervisor/shared/web_workflow/web_workflow.c
#                 (supervisor_start_web_workflow), shared-module/os/__init__.c
#                 (common_hal_os_getenv) and shared-bindings/supervisor/__init__.c
#                 (supervisor_get_setting). Not yet confirmed on hardware.
#   errors        [key, message] pairs the supervisor prints after a reset on wifi boards, as
#                 "An error occurred while retrieving '<key>':" then the message. Only wifi
#                 boards read CIRCUITPY_WIFI_* at boot; every other board must print none.
#   connected     wifi.radio.connected after the reset (wifi boards only)
#   getenv        os.getenv(key) == value; getenv_none: returns None; getenv_present: not None;
#                 getenv_raises: {key = exception name} os.getenv(key) must raise
#   setting       supervisor.get_setting(key) == value, same type; setting_error: ValueError
#   needs_wifi    only says something on a board with a radio (marked needs("wifi"))
#   needs_creds   the file carries the farm SSID / password; skipped when .env lacks them

