# cp-regress farm description for bravo.
# Resolve everything from `usb` (the sysfs hub port path) at the moment of use.
# Never put ttyACM numbers, /dev/sd? names or CIRCUITPY<n> labels in here.
#
# caps: what the board can do with no extra wiring.
#   native_usb  CircuitPython's own USB device stack (CDC + MSC). Only the USB tests
#               (usb_*, web_workflow's MSC checks) need it; the rest run over any console.
#   uf2         UF2 bootloader with an MSC volume
#   wifi        native wifi module
#   ble         _bleio available
#   esp32spi    AirLift coprocessor (needs adafruit_esp32spi on the board)
#   usb_host    usb.core host port wired
#   reset_ok    microcontroller.reset() is safe on this board
# wiring: jumpers / fixtures physically attached. Tests that need them skip
#   until you add the key here. Pin names are board.<NAME>.
# power: uhubctl repeat / wait values that actually cut this port. also (optional): other hub
#   ports that feed the same board, cut with it (a dev kit with a USB-JTAG and a UART port).
# fs (optional, default "drive"): how board files are read and written. "drive" is the
#   CIRCUITPY mount; "repl" is the raw REPL (base64, lib/farmlib.py Repl.put_file), for boards
#   with no native USB and so no drive. Not for "small" boards: needs binascii. "web" is the
#   web workflow's /fs/ API (Repl until it answers: found by MAC over mDNS, board_id checked,
#   password farmlib.WEB_API_PASSWORD, which flashed_fs puts in settings.toml); needs "wifi".
# console_baud (optional): the console is a real UART behind the tty (a CP2102N, a probe's
#   CDC). Device code then goes in pieces of about 600 bytes, as on "small" boards.
# reset (optional): "rts", EN wired to the UART bridge's RTS. recover() pulses it first, for a
#   board its USB port does not power.
# settings (optional): settings.toml keys this board always needs, merged under each module's
#   own by flashed_fs. Strings, integers or booleans.
# flash: how flashed_firmware writes an image (uf2 copy, esptool + tinyuf2, or openocd over SWD).
# run_tests / skip_tests (optional, pytest only): paths under test/ as a folder, a file or a
#   test, after Brent's hil-boards.json. Only run_tests run on this board (omit for all);
#   skip_tests are reported as skipped. Both narrow --tier and the markers, never widen them.
#     run_tests = ["hardware/"]
#     skip_tests = ["hardware/ble_pair_test.py", "hardware/core_vm_test.py::test_vid_pid"]
#
# Every entry is checked at session start (name, board_id, usb path, flash method keys, power
# values, selectors); `pytest --list-boards` checks and prints the farm without touching it.

[host]
# Overridden by CPR_HOST_IP. Auto-detected when empty.
ip = ""
# uhubctl is unprivileged on bravo via udev. Never sudo it.
uhubctl = "uhubctl"

[network]
# Read from the environment so secrets never land in the repo.
ssid_env = "CPR_WIFI_SSID"
password_env = "CPR_WIFI_PASSWORD"
# Optional: public HTTPS hosts for the external TLS check. Failures here are
# reported as "external", not as regressions.
public_tls_hosts = ["https://www.adafruit.com/api/quotes.php", "https://httpbin.org/get", "https://api.github.com/"]
# base_secrets refuses the run unless the SSID is one of these (the prod guard).
allowed_ssids = ["foreverrun"]

[broker]
# Local ProtoMQ on bravo, Brent's WipperSnapper test broker. Ports are his.
# Pinned: adafruit/protomq 9e2e1bf, adafruit/Wippersnapper_Protobuf api-v2 b3688d6.
dir = "~/protomq"
node = "~/node22/bin/node"
mqtt_port = 1884
api_port = 5173

[[board]]
name = "metro_rp2040"
board_id = "adafruit_metro_rp2040"
usb = "3-3.2"
port = "raspberrypi"
caps = ["native_usb", "uf2", "reset_ok"]
power = { r = 30, w = 500, settle = 12 }
notes = "Needs a full VBUS cycle; -a on is a no-op."
flash = { method = "uf2" }
wiring = {}

[[board]]
name = "metro_m4_airlift"
board_id = "metro_m4_airlift_lite"
usb = "3-3.3.1"
port = "atmel-samd"
caps = ["native_usb", "uf2", "esp32spi", "reset_ok"]
power = { r = 30, w = 500, settle = 12 }
notes = "VBUS cycling does not reset it; tap reset via SWD."
flash = { method = "swd", probe = "E6647C740349682C", target = "target/atsame5x.cfg", speed = 500, fast_speed = 2000, connect = "halt" }
wiring = {}

[[board]]
name = "metro_m0"
board_id = "metro_m0_express"
usb = "3-3.3.2"
port = "atmel-samd"
caps = ["native_usb", "uf2", "small"]
power = { r = 30, w = 500, settle = 12 }
notes = "No binascii, no zlib. microcontroller.reset() is hazardous: not reset_ok."
flash = { method = "swd", probe = "E6647C74039F6B2D", target = "target/at91samdXX.cfg", speed = 2000, connect = "reset halt", rescue_speed = 400 }
wiring = {}

[[board]]
name = "feather_nrf52840"
board_id = "feather_nrf52840_express"
usb = "3-3.3.3"
port = "nordic"
caps = ["native_usb", "ble", "reset_ok"]
power = { r = 30, w = 500, settle = 30 }
notes = "Bootloader is CDC only, no MSC volume. Sets the farm's 30 s floor."
flash = { method = "swd", probe = "E6647C74034E732F", target = "target/nrf52.cfg", speed = 4000, connect = "halt" }
wiring = {}

[[board]]
name = "metro_esp32s2"
board_id = "adafruit_metro_esp32s2"
usb = "3-3.3.4.1"
port = "espressif"
caps = ["native_usb", "uf2", "wifi", "reset_ok"]
power = { r = 80, w = 300, settle = 15 }
notes = "Wedges easily, needs a long power-off."
flash = { method = "esp_uf2", chip = "esp32s2", flash_size = "4MB", bootloader_offset = "0x1000", tinyuf2_offset = "0x2d0000", tinyuf2_dir = "~/wippersnapper/tinyuf2-esp32s2" }
wiring = {}

[[board]]
name = "metro_rp2350"
board_id = "adafruit_metro_rp2350"
usb = "3-3.3.4.2"
port = "raspberrypi"
caps = ["native_usb", "uf2", "reset_ok"]
power = { r = 30, w = 500, settle = 12 }
notes = "No SWD reset path; BOOTSEL is the third rung."
flash = { method = "uf2" }
wiring = {}

[[board]]
name = "metro_esp32s3"
board_id = "adafruit_metro_esp32s3"
usb = "3-3.3.4.3"
port = "espressif"
caps = ["native_usb", "uf2", "wifi", "ble", "reset_ok"]
power = { r = 80, w = 300, settle = 15 }
notes = "Needs -r 80 -w 300 to power off."
flash = { method = "esp_uf2", chip = "esp32s3", flash_size = "16MB", bootloader_offset = "0x0", tinyuf2_offset = "0x410000", tinyuf2_dir = "~/wippersnapper/tinyuf2-esp32s3" }
wiring = {}

[[board]]
name = "feather_stm32f405"
board_id = "feather_stm32f405_express"
usb = "3-3.3.4.4"
port = "stm"
caps = ["native_usb", "reset_ok"]
power = { r = 30, w = 500, settle = 12, tries = 3 }
notes = "No UF2 bootloader. Must be settled before flashing. Comes up unreliably (crystal load caps, fixed in the next hardware rev), so it gets 3 tries."
# perf_core lost the board 9 of 9 runs on bravo, 2026-10-17, each after a clean power cycle
dns_tests = ["hardware/perf_core_test.py"]
flash = { method = "swd", probe = "E6647C740327322C", target = "target/stm32f4x.cfg", speed = 1000, connect = "reset halt", bin_base = "0x08000000" }
wiring = {}

# ---- dev hub 3-6: boards with no native USB, and newer chips. They run whatever build is on
# them (no flash method yet), so --firmware runs leave them out.

# 2026-10-22: the C6 is unplugged; 3-6.3.1 now holds a Feather ESP32 V2 (WipperSnapper
# HIL, ~/ws-hil/hil/hil-boards.json), so this entry would resolve to the wrong board.
# [[board]]
# name = "feather_esp32c6"
# board_id = "adafruit_feather_esp32c6_4mbflash_nopsram"
# usb = "3-6.3.1"
# port = "espressif"
# caps = ["wifi", "ble", "reset_ok"]
# fs = "web"
# power = { r = 80, w = 300, settle = 15 }
# notes = "No native USB: console on the USB-JTAG/serial unit, files over the web workflow. A LiPo is plugged in (MAX17048 VCELL 4.12 V), so no USB power cut resets it."
# # 2026-10-20: the console's output runs one write behind (each reply arrives with the next
# # input), and it survives microcontroller.reset(), an RTS reset, a watchdog reset and cuts on
# # 3-6.3 and 3-6 (uptime kept counting: the LiPo). Until the LiPo is unplugged for a real
# # power-on reset, nothing here can start reliably.
# dns_tests = ["hardware/"]
# wiring = {}

[[board]]
name = "feather_esp32_v2"
board_id = "adafruit_feather_esp32_v2"
usb = "3-6.3.1"
port = "espressif"
# No "ble": the Picos on 3-6.3 are doing BLE work (2026-10-23).
caps = ["wifi", "reset_ok"]
fs = "web"
console_baud = 115200
# CH9102 auto-reset circuit: opening the port resets the board (POWERON_RESET in the boot log).
reset = "rts"
power = { r = 30, w = 500, settle = 15 }
notes = "No native USB: console on the CH9102F (1a86:55d4), files over the web workflow. 11.0.0-alpha.1 as found 2026-10-23."
wiring = {}
# A0 is GPIO26, on ADC2, which the ESP32 cannot read while WiFi is on: AnalogIn(A0).value
# raises IDFError "Operation timed out" (smoke run, 2026-10-23).
skip_tests = ["hardware/peripherals_selfcheck_test.py::test_analog_read",
              "hardware/peripherals_selfcheck_test.py::test_analog_range"]

[[board]]
name = "esp32c5_devkitc"
board_id = "espressif_esp32c5_devkitc_1_n8r8"
usb = "3-6.4.3"
port = "espressif"
caps = ["wifi", "ble", "reset_ok"]
fs = "web"
# Cycling 3-6.4.3 alone did not reset it (uptime 32 s -> 70 s); both ports did. The first
# write 10 s after that timed out, so a longer settle.
power = { r = 80, w = 300, settle = 20, also = ["3-6.4.4"] }
notes = "No native USB: console on the USB-JTAG/serial port; its UART port (3-6.4.4) also powers it."
# In a full smoke run, after microcontroller.reset() its USB-JTAG console takes no input for
# over 40 s once code.py starts (writes time out; 3 of 3 runs, 2026-10-20), while the module
# alone passes 2 of 2. The two-port power cycle brings it back each time. Cause unknown.
dns_tests = ["hardware/serialmon_hw_test.py::test_hard_reset_reopens"]
wiring = {}

[[board]]
name = "korvo_esp32s31"
board_id = "espressif_esp32s31_korvo_1"
usb = "3-6.4.2"
port = "espressif"
caps = ["reset_ok"]
fs = "repl"
console_baud = 115200
# Cutting the CP2102N's port does not reset the board (powered elsewhere); RTS does.
reset = "rts"
power = { r = 30, w = 500, settle = 15 }
notes = "Console on the CP2102N (UART0). No wifi module in this build."
# build 140 (2026-10-20) sees BOOT pressed on every reset: USER safe mode 4 of 4 without this,
# 0 of 2 with it. The delay of 0 skips the button wait (supervisor/shared/safe_mode.c).
settings = { CIRCUITPY_SAFE_MODE_DELAY = 0 }
wiring = {}

[[board]]
name = "p4gpio"
board_id = "adafruit_p4gpio"
usb = "3-6.3.4.4"
port = "espressif"
caps = ["native_usb", "reset_ok"]
power = { r = 80, w = 300, settle = 15 }
notes = "ESP32-P4, native USB on the high-speed port; its USB-JTAG unit is 3-6.3.4.3. No wifi module."
wiring = {}

[[board]]
name = "nrf54lm20dk"
board_id = "nordic_nrf54lm20dk"
usb = "3-6.1.1"
port = "zephyr-cp"
caps = ["native_usb", "ble", "reset_ok"]
power = { r = 30, w = 500, settle = 15 }
notes = "zephyr-cp build. Its J-Link OB is not on this USB path."
wiring = {}

[[board]]
name = "siwx917_dk2605a"
board_id = "silabs_siwx917_dk2605a"
usb = "3-6.1.3"
port = "zephyr-cp"
caps = ["wifi", "ble", "reset_ok"]
fs = "repl"
console_baud = 115200
power = { r = 30, w = 500, settle = 15 }
notes = "zephyr-cp. usb is its J-Link OB: console on the OB's CDC, which stays on the bus through a reset. LittleFS, no drive."
# Build 11.0.0-alpha.1-78-g5474786a3f-dirty: growing a heap block past a few KB corrupts memory
# (fresh boot: 800 list.append()s fine, 2000 raise AttributeError "'list' object has no attribute
# 'LED'"; a 300-key dict or 250 names in one compile hang). These modules need such blocks.
dns_tests = ["hardware/perf_core_test.py", "hardware/settings_toml_test.py",
             "hardware/displayio_headless_test.py"]
wiring = {}

